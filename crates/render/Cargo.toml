[package]
name = "evoeffect-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evoeffect-time = { workspace = true }
evoeffect-geom = { workspace = true }
evoeffect-color = { workspace = true }
evoeffect-keyframe = { workspace = true }
evoeffect-project = { workspace = true }
evoeffect-raster = { workspace = true }
evoeffect-path = { workspace = true }
evoeffect-text = { workspace = true }
evoeffect-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
evoeffect-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
