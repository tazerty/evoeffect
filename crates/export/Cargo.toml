[package]
name = "evoeffect-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC), ProRes and uncompressed MOV (+PCM) via EvoFilm, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via EvoEffect encoders, PNG/JPEG/TIFF/EXR sequences, animated GIF, WAV/AIFF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evoeffect-time = { workspace = true }
evoeffect-project = { workspace = true }
evoeffect-raster = { workspace = true }
evoeffect-render = { workspace = true }
evofilm-h264enc = { workspace = true }
evofilm-prores = { workspace = true }
evofilm-aac = { workspace = true }
evofilm-isobmff = { workspace = true }
evoeffect-opusenc = { workspace = true }
evoeffect-vp9enc = { workspace = true }
evoeffect-hevcenc = { workspace = true }
evoeffect-av1enc = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "exr"] }
gif = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
evoeffect-media = { workspace = true }
evoeffect-effects = { workspace = true }
evoeffect-color = { workspace = true }
evofilm-opus = { workspace = true }
evofilm-vp9 = { workspace = true }
evoeffect-keyframe = { workspace = true }
