[package]
name = "evoeffect-host"
description = "Builds a fully wired EvoEffect session: media decoding (EvoFilm codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evoeffect-engine = { workspace = true }
evoeffect-project = { workspace = true }
log = { workspace = true }
evoeffect-media = { workspace = true }
evoeffect-expr = { workspace = true }
evoeffect-script = { workspace = true }
evoeffect-export = { workspace = true }
evoeffect-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
evoeffect-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
evoeffect-psd = { workspace = true }
evoeffect-svg = { workspace = true }
evoeffect-pdf = { workspace = true }
evoeffect-raster = { workspace = true }
evoeffect-time = { workspace = true }
evoeffect-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
