[package]
name = "evoeffect-gpu"
description = "The GPU compositor (wgpu compute): layer transforms, masks/mattes, the 38 blend modes, motion blur, bit-depth quantisation and GPU effects, with the CPU renderer as the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evoeffect-time = { workspace = true }
evoeffect-geom = { workspace = true }
evoeffect-color = { workspace = true }
evoeffect-project = { workspace = true }
evoeffect-raster = { workspace = true }
evoeffect-effects = { workspace = true }
evoeffect-render = { workspace = true }
evoeffect-keyframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[dev-dependencies]
evoeffect-text = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
