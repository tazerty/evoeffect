[package]
name = "evoeffect-media"
description = "Footage import: probing, stills, image sequences, video and audio via EvoFilm's pure-Rust codecs, memory-budgeted frame cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evo-docpath = { workspace = true }
evoeffect-time = { workspace = true }
evoeffect-project = { workspace = true }
evoeffect-raster = { workspace = true }
evoeffect-render = { workspace = true }
evoeffect-psd = { workspace = true }
evoeffect-svg = { workspace = true }
evoeffect-pdf = { workspace = true }
evoeffect-model = { workspace = true }
evofilm-codecs = { workspace = true }
evofilm-media = { workspace = true }
evofilm-isobmff = { workspace = true }
evofilm-frame = { workspace = true }
evofilm-color = { workspace = true }
evofilm-time = { workspace = true }
# AIFF import (#1428): enables the aiff reader of evofilm-codecs' symphonia.
symphonia = { workspace = true }
exr = { workspace = true }
gif = { workspace = true }
image = { workspace = true, features = ["gif", "webp", "tiff", "bmp", "exr", "tga", "hdr"] }
rayon = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
