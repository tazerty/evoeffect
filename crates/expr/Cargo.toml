[package]
name = "evoeffect-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evoeffect-time = { workspace = true }
evoeffect-geom = { workspace = true }
evoeffect-keyframe = { workspace = true }
serde_json = { workspace = true }
evoeffect-project = { workspace = true }
evoeffect-path = { workspace = true }
evoeffect-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
evoeffect-color = { workspace = true }
evoeffect-effects = { workspace = true }
evoeffect-text = { workspace = true }
