[package]
name = "evoeffect-ui-egui"
description = "The EvoEffect egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
evo-ui = { workspace = true }
evoeffect-time = { workspace = true }
evoeffect-geom = { workspace = true }
evoeffect-color = { workspace = true }
evoeffect-keyframe = { workspace = true }
evoeffect-project = { workspace = true }
evoeffect-path = { workspace = true }
evoeffect-text = { workspace = true }
evoeffect-render = { workspace = true }
evoeffect-engine = { workspace = true }
evoeffect-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
evoeffect-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
