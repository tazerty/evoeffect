[workspace]
exclude = ["vendor/evo-libs", "vendor/evofilm"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/tazerty/evoeffect"

[workspace.dependencies]
evo-pdf = { path = "vendor/evo-libs/evo-pdf", default-features = false, features = ["read"] }
evo-docpath = { path = "vendor/evo-libs/evo-docpath" }
# internal
evoeffect-time = { path = "crates/time" }
evoeffect-geom = { path = "crates/geom" }
evoeffect-color = { path = "crates/color" }
evoeffect-raster = { path = "crates/raster" }
evoeffect-path = { path = "crates/path" }
evoeffect-keyframe = { path = "crates/keyframe" }
evoeffect-project = { path = "crates/project" }
evoeffect-text = { path = "crates/text" }
evoeffect-effects = { path = "crates/effects" }
evoeffect-track = { path = "crates/track" }
evoeffect-segment = { path = "crates/segment" }
evoeffect-model = { path = "crates/model" }
evoeffect-render = { path = "crates/render" }
evoeffect-gpu = { path = "crates/gpu" }
evoeffect-media = { path = "crates/media" }
evoeffect-export = { path = "crates/export" }
evoeffect-expr = { path = "crates/expr" }
evoeffect-lottie = { path = "crates/lottie" }
evoeffect-interchange = { path = "crates/interchange" }
evoeffect-pdf = { path = "crates/pdf" }
evoeffect-psd = { path = "crates/psd" }
evoeffect-vp9enc = { path = "crates/vp9enc" }
evoeffect-svg = { path = "crates/svg" }
evoeffect-engine = { path = "crates/engine" }
evoeffect-host = { path = "crates/host" }
evoeffect-ui-egui = { path = "crates/ui-egui" }
evoeffect-automation = { path = "crates/automation" }
evoeffect-opusenc = { path = "crates/opusenc" }
evoeffect-script = { path = "crates/script" }
evoeffect-hevcenc = { path = "crates/hevcenc" }
evoeffect-av1enc = { path = "crates/av1enc" }
evoeffect-plugin = { path = "crates/plugin" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# media codecs + containers: EvoFilm's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
evofilm-codecs = { path = "vendor/evofilm/evofilm-codecs" }
evofilm-media = { path = "vendor/evofilm/evofilm-media" }
evofilm-frame = { path = "vendor/evofilm/evofilm-frame" }
evofilm-color = { path = "vendor/evofilm/evofilm-color" }
evofilm-time = { path = "vendor/evofilm/evofilm-time" }
# encoders + muxer (crates/export)
evofilm-h264enc = { path = "vendor/evofilm/evofilm-h264enc" }
evofilm-prores = { path = "vendor/evofilm/evofilm-prores" }
evofilm-aac = { path = "vendor/evofilm/evofilm-aac" }
evofilm-isobmff = { path = "vendor/evofilm/evofilm-isobmff" }
# decoder used as the round-trip oracle of evoeffect-opusenc (crates/export dev-dependency)
evofilm-opus = { path = "vendor/evofilm/evofilm-opus" }
evofilm-vp9 = { path = "vendor/evofilm/evofilm-vp9" }
# decoders used as the round-trip oracles of evoeffect-hevcenc / evoeffect-av1enc (dev-dependencies only)
evofilm-hevc = { path = "vendor/evofilm/evofilm-hevc" }
evofilm-av1 = { path = "vendor/evofilm/evofilm-av1" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
evofilm-interchange = { path = "vendor/evofilm/evofilm-interchange" }
evofilm-project = { path = "vendor/evofilm/evofilm-project" }
evofilm-geom = { path = "vendor/evofilm/evofilm-geom" }
# The symphonia evofilm-codecs already builds, named only to turn on its AIFF reader: the pinned
# rev enables wav alone (EvoFilm main enables aiff too). Drop it when the pin moves past that.
symphonia = { version = "0.5.5", default-features = false, features = ["aiff"] }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
evo-ui = { path = "vendor/evo-libs/evo-ui", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against an EvoFilm checkout next to this repo: uncomment.
# [patch."https://github.com/tazerty/evofilm"]
# evofilm-codecs = { path = "../evofilm/crates/codecs" }
# evofilm-media = { path = "../evofilm/crates/media" }
# evofilm-frame = { path = "../evofilm/crates/frame" }
# evofilm-color = { path = "../evofilm/crates/color" }
# evofilm-time = { path = "../evofilm/crates/time" }
# evofilm-h264enc = { path = "../evofilm/crates/h264enc" }
# evofilm-prores = { path = "../evofilm/crates/prores" }
# evofilm-aac = { path = "../evofilm/crates/aac" }
# evofilm-isobmff = { path = "../evofilm/crates/isobmff" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Panics and backtraces keep file and line; full debug info only made the many test binaries large.
debug = "line-tables-only"

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.evoeffect-raster]
opt-level = 3

[profile.dev.package.evoeffect-render]
opt-level = 3

[profile.dev.package.evoeffect-gpu]
opt-level = 3

[profile.dev.package.evoeffect-effects]
opt-level = 3

[profile.dev.package.evoeffect-track]
opt-level = 3

[profile.dev.package.evoeffect-path]
opt-level = 3

[profile.dev.package.evoeffect-media]
opt-level = 3

[profile.dev.package.evoeffect-opusenc]
opt-level = 3

[profile.dev.package.evoeffect-export]
opt-level = 3

[profile.dev.package.evoeffect-vp9enc]
opt-level = 3

[profile.dev.package.evoeffect-hevcenc]
opt-level = 3

[profile.dev.package.evoeffect-av1enc]
opt-level = 3

# EvoFilm codec hot loops (same settings as EvoFilm's own workspace).
[profile.dev.package.evofilm-h264]
opt-level = 3

[profile.dev.package.evofilm-h264enc]
opt-level = 3

[profile.dev.package.evofilm-hevc]
opt-level = 3

[profile.dev.package.evofilm-vp9]
opt-level = 3

[profile.dev.package.evofilm-prores]
opt-level = 3

[profile.dev.package.evofilm-dnx]
opt-level = 3

[profile.dev.package.evofilm-av1]
opt-level = 3

[profile.dev.package.evofilm-aac]
opt-level = 3

[profile.dev.package.evofilm-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
hayro-syntax = { path = "vendor/evo-libs/hayro-syntax" }
hayro-jbig2 = { path = "vendor/evo-libs/hayro-jbig2" }
