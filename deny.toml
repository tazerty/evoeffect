# cargo-deny configuration of the Evora fork (written by Evora; the upstream repository has none).
# Checked by .github/workflows/evora-web.yml: `cargo deny --manifest-path
# apps/evoeffect-web/Cargo.toml --config deny.toml check advisories bans licenses sources`, i.e.
# the crate graph of the web build only (the shipped artefact), for the wasm32 target, without
# dev-dependencies; every category since EVORA-KIN-23 (bans and sources added).
#
# Nothing is relaxed silently: every allowed licence is listed below with the reason it is
# acceptable, every ignored advisory must carry an `id` and a `reason`, and cargo-deny's
# warnings stay in the job log.

[graph]
targets = ["wasm32-unknown-unknown"]
exclude-dev = true

[advisories]
# RustSec advisory database (default). Vulnerabilities always fail; unmaintained and unsound
# advisories fail for every crate of the graph (stricter than cargo-deny's `workspace` default
# for `unsound`); a yanked crate version fails.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # paste 1.0.15 (archived by its author, "no safe upgrade"): a procedural macro, run at build
    # time only, so none of its code is in the wasm; reached through exr <- pulp (image, engine,
    # media). Reviewed 2026-10-13 (EVORA-KIN-05); to re-examine at every upstream version bump.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc-macro, unmaintained, no safe upgrade, not shipped in the wasm (via exr <- pulp)" },
]

[licenses]
# Permissive licences only, as the upstream AGENTS.md requires (MIT, Apache, BSD, ISC, Zlib,
# unmodified MPL-2.0), plus the Unicode data licence of the Unicode tables crates.
# (Only licences met in the graph are listed: an unused allowance is a cargo-deny warning.)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
exceptions = [
    # egui's default fonts, compiled into the binary (Ubuntu Light, Hack, Noto Emoji, the emoji
    # icon font): font licences that allow embedding and redistribution with their text, which
    # cargo-about copies into LICENSES/THIRD-PARTY-LICENSES.txt. Reviewed 2026-10-13 (EVORA-KIN-05).
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# The workspace crates are `MIT OR Apache-2.0` (Cargo.toml) and are checked like the others.
ignore = false

[bans]
# No crate is banned by name yet: what the shipped graph may contain is judged by the patches'
# gates (E7 neutralisations) and, at each upstream version, by the surface diff (NR-12). Several
# versions of one crate are reported (warnings stay in the job log), never refused: the graph is
# upstream's. Wildcard requirements are allowed: they are the workspace's own path dependencies
# (`{ path = "crates/…" }`), which come from no registry.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
# Only crates.io. The libraries upstream pulls by git are copied under vendor/ at the exact revision
# of the tag (D-19): vendor/evofilm (media codecs and containers, 2c5ba7a7) and vendor/evo-libs
# (evo-ui 5c874d51; evo-docpath 82a24b00; evo-pdf, hayro-syntax and hayro-jbig2 9f75d3dc), so no git
# source is admitted any more. Any other registry or git source fails. Two CI witnesses keep this
# true: Cargo.lock holds no git source (and that control must redden on a copy with one planted),
# and a copy of this file that no longer admits crates.io must make this category fail.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
