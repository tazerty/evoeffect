[package]
name = "evofilm-vp9"
description = "Clean-room pure-Rust VP9 decoder (VP9 Bitstream & Decoding Process Specification)"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
evofilm-bitstream = { path = "../evofilm-bitstream" }
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

