[package]
name = "evofilm-interchange"
description = "EvoFilm interchange: CMX 3600 EDL, Final Cut Pro 7 XML (xmeml), FCPXML and OpenTimelineIO import/export"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
evofilm-time = { path = "../evofilm-time" }
evofilm-geom = { path = "../evofilm-geom" }
evofilm-color = { path = "../evofilm-color" }
evofilm-media = { path = "../evofilm-media" }
evofilm-project = { path = "../evofilm-project" }
evofilm-cfb = { path = "../evofilm-cfb" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
roxmltree = { version = "0.21" }

