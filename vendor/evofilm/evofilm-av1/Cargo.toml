[package]
name = "evofilm-av1"
description = "Clean-room AV1 decoder (AV1 Bitstream & Decoding Process Specification v1.0.0 with Errata 1)"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
evofilm-bitstream = { path = "../evofilm-bitstream" }
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

