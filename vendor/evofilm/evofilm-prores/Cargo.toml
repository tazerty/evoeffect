[package]
name = "evofilm-prores"
description = "Clean-room Apple ProRes (SMPTE RDD 36) decoder and encoder"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
evofilm-bitstream = { path = "../evofilm-bitstream" }
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

