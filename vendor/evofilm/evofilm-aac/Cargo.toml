[package]
name = "evofilm-aac"
description = "Clean-room AAC-LC encoder and decoder (ISO/IEC 14496-3)"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
evofilm-bitstream = { path = "../evofilm-bitstream" }
thiserror = { version = "2" }
rayon = { version = "1", optional = true }

