[package]
edition = "2024"
rust-version = "1.92"
name = "hayro-syntax"
version = "0.7.2"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A low-level crate for reading PDF files."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LaurenzV/hayro"
resolver = "2"

[features]
default = ["std", "images"]
images = ["dep:zune-jpeg", "dep:hayro-ccitt", "dep:hayro-jbig2", "dep:hayro-jpeg2000"]
logging = ["dep:log", "hayro-jpeg2000?/logging"]
std = ["hayro-jbig2?/std", "hayro-jpeg2000?/std", "dep:rustc-hash", "dep:stringprep", "zune-jpeg?/std"]
unsafe = ["std", "dep:flate2", "dep:memchr", "hayro-jbig2?/simd", "hayro-jpeg2000?/simd", "zune-jpeg?/x86", "zune-jpeg?/neon"]

[lib]
name = "hayro_syntax"
path = "src/lib.rs"

[dependencies]
flate2 = { version = "1", optional = true }
hayro-ccitt = { version = "0.3.0", optional = true, default-features = false }
hayro-jbig2 = { version = "=0.3.0", optional = true, default-features = false }
hayro-jpeg2000 = { version = "0.3.5", optional = true, default-features = false }
log = { version = "0.4", optional = true }
memchr = { version = "2.8.0", features = ["alloc"], optional = true, default-features = false }
rustc-hash = { version = "2", optional = true }
smallvec = { version = "1" }
stringprep = { version = "0.1", optional = true }
zune-jpeg = { version = "0.5", optional = true, default-features = false }

